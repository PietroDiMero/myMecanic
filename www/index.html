
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: linear-gradient(to right, #4f8cff, #1ec8e7);
      height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    .login-wrapper {
      background: #fff;
      padding: 2rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.6s ease-out;
    }

    .login-wrapper h2 {
      text-align: center;
      color: #123;
      margin-bottom: 1.5rem;
    }

    .login-wrapper label {
      font-weight: 600;
      color: #444;
      display: block;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    .login-wrapper input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #d0d7e2;
      border-radius: 10px;
      font-size: 1em;
      background: #f9fafd;
      box-sizing: border-box;
      transition: border 0.2s;
    }

    .login-wrapper input:focus {
      border-color: #4f8cff;
      outline: none;
    }

    .login-wrapper button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      font-size: 1.1em;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #4f8cff 0%, #1ec8e7 100%);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
      cursor: pointer;
    }

    .login-wrapper button:active {
      transform: scale(0.97);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <h2>Connexion Mécano 🔧</h2>
<form onsubmit="login(event)">
  <input type="text" id="username" placeholder="Identifiant" required />
  <input type="password" id="password" placeholder="Mot de passe" required />
  <button type="submit">Connexion</button>
</form>

  </div>
  <div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
