<h2>➕ Ajouter un travail</h2>

<form id="formTravailGlobal">
  <label for="clientSelect">👤 Client :</label>
  <select id="clientSelect" required>
    <option value="">-- Sélectionner un client --</option>
  </select>

  <label for="vehiculeSelect">🚗 Véhicule :</label>
  <select id="vehiculeSelect" required>
    <option value="">-- Sélectionner un véhicule --</option>
  </select>

  <label for="description">🛠️ Description :</label>
  <input type="text" name="description" id="description" required>

  <label for="forfaitSelect">📦 Forfait :</label>
<select id="forfaitSelect" name="forfait_id">
  <option value="">-- Aucun forfait --</option>
</select>


  <label for="date_travail">📅 Date du travail :</label>
  <input type="date" name="date_travail" id="date_travail" required>
  
  <input type="hidden" name="vehicule_id" id="vehicule_id">
  <input type="hidden" name="client_id" id="client_id">

  <button type="submit">💾 Enregistrer</button>
</form>

<div id="messageTravail"></div>
